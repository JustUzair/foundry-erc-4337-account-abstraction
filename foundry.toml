[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = 'test'
cache_path  = 'cache_forge'
remappings = ["@eth-infinitism/account-abstraction=lib/account-abstraction/contracts","@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options


[rpc_endpoints]
anvil_local="${ANVIL_LOCAL_TESTNET}"
polygon_amoy = "${AMOY_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
optimism_sepolia = "${OPTIMISM_SEPOLIA}"
eth_sepolia = "${ETHEREUM_SEPOLIA}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA}"

eth_mainnet = "${ETHEREUM_MAINNET}"
base_mainnet = "${BASE_MAINNET}"
polygon_mainnet = "${POLYGON_MAINNET}"
optimism_mainnet = "${OPTIMISM_MAINNET}"
arbitrum_mainnet = "${ARBITRUM_MAINNET}"

buildbear="${BUILDBEAR_RPC}"



[etherscan]
buildbear = { key = "verifyContract", url="https://rpc.dev.buildbear.io/verify/etherscan/civil-hawkeye-bee9aee4" }


